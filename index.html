<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalX Health Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0f1e;
            --card: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f8fafc;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
      

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0a0f1e);
            color: var(--text);
            margin: 0;
            padding-bottom: 90px;
            min-height: 100vh;
        }

        .container { max-width: 480px; margin: auto; padding: 20px; }

        .nav-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px); display: flex; justify-content: space-around;
            padding: 12px; border-radius: 24px; border: 1px solid var(--glass-border); z-index: 1000;
        }

        .nav-item { cursor: pointer; opacity: 0.5; font-size: 0.65rem; font-weight: 700; text-align: center; transition: 0.3s; color: white; }
        .nav-item.active { opacity: 1; color: var(--primary); transform: translateY(-2px); }

        .page { display: none; animation: fadeIn 0.4s ease-out; }
        .page.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .gauge-wrapper { position: relative; width: 280px; height: 180px; margin: 20px auto; display: flex; justify-content: center; }
        #gauge-svg { width: 100%; height: 100%; }
        #needle-group { transform-origin: 100px 100px; transition: transform 1.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

        .card { background: var(--card); backdrop-filter: blur(10px); padding: 20px; border-radius: 24px; margin-bottom: 20px; border: 1px solid var(--glass-border); }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-item { padding: 10px; text-align: center; }
        .stat-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .stat-value { font-size: 1.1rem; font-weight: 800; }

        input, select { width: 100%; padding: 14px; margin: 10px 0; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border); color: white; border-radius: 12px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: white; }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .log-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .del-btn { color: #64748b; background: none; border: none; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div id="page-dash" class="page active">
        <div style="text-align: center;">
            <span id="bmr-tag" style="background: rgba(56, 189, 248, 0.1); color: var(--primary); padding: 6px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; border: 1px solid var(--primary);">BMR: 0 kcal</span>
        </div>

        <div class="gauge-wrapper">
            <svg id="gauge-svg" viewBox="0 0 200 120">
                <path d="M20,100 A80,80 0 0,1 180,100" fill="none" stroke="#2d3748" stroke-width="12" stroke-linecap="round"/>
                <path d="M20,100 A80,80 0 0,1 180,100" fill="none" stroke="url(#gauge-gradient)" stroke-width="12" stroke-linecap="round"/>
                <defs>
                    <linearGradient id="gauge-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ef4444" />
                        <stop offset="50%" stop-color="#10b981" />
                        <stop offset="100%" stop-color="#f59e0b" />
                    </linearGradient>
                </defs>
                <g id="needle-group"><path d="M100,100 L35,100" stroke="white" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="white"/></g>
            </svg>
        </div>

        <div style="text-align: center; margin-top: -30px; margin-bottom: 20px;">
            <div id="net-val" style="font-size: 3.5rem; font-weight: 800; margin: 5px 0;">0</div>
            <div id="status-desc" style="font-size: 0.85rem; font-weight: 700; letter-spacing: 1px;">INITIALIZING</div>
        </div>

        <div class="card" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; margin-bottom: 15px;">
            <button onclick="changeDate(-1)" style="background:none; border:none; color:var(--primary); font-size:1.5rem; cursor:pointer;">❮</button>
            <div style="text-align: center; cursor: pointer;" onclick="document.getElementById('date-jump').showPicker()">
               
                              <div id="display-date" style="font-weight: 800; font-size: 0.9rem; color:var(--primary);">Today</div>

              
<input type="date" id="date-jump" onchange="jumpToDate(this.value)" 
               style="background:transparent; display:none; border:none; color:var(--primary); font-weight:800; font-size:0.9rem; font-family:inherit; cursor:pointer; outline:none;">              
            </div>
            <button onclick="changeDate(1)" style="background:none; border:none; color:var(--primary); font-size:1.5rem; cursor:pointer;">❯</button>
        </div>

        <div class="card" style="text-align: center; border: 1px solid var(--primary);">
            <div class="stat-label">Journey Remaining</div>
            <div id="journey-val" style="font-size: 1.8rem; font-weight: 800; color: var(--primary);">0 kcal</div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; margin-top: 15px; border-top: 1px solid var(--glass-border); padding-top: 10px;">
                <div><div class="stat-label">Days Left</div><div id="days-left" style="font-weight: 700;">--</div></div>
                <div><div class="stat-label">Daily Target</div><div id="daily-req" style="font-weight: 700;">--</div></div>
            </div>

            <div style="margin-top: 15px; border-top: 1px solid var(--glass-border); padding-top: 10px;">
                <div class="stat-label">Expected Weight</div>
                <div id="expected-weight" style="font-size: 1.2rem; font-weight: 800; color: var(--success);">-- kg</div>
            </div>
        </div>

        <div class="card stat-grid">
            <div class="stat-item"><div class="stat-label">Rest Burn</div><div class="stat-value" id="rest-burn">0</div></div>
            <div class="stat-item"><div class="stat-label">Workouts</div><div class="stat-value" id="work-burn">0</div></div>
            <div class="stat-item" style="border-top: 1px solid var(--glass-border)"><div class="stat-label">Intake</div><div class="stat-value" id="intake-total">0</div></div>
            <div class="stat-item" style="border-top: 1px solid var(--glass-border)"><div class="stat-label">Gap</div><div class="stat-value" id="goal-gap">0</div></div>
        </div>
    </div>

    <div id="page-add" class="page">
        <h2 style="font-weight: 800;">Log Activity</h2>
        <div class="card">
            <div style="display:flex; gap:10px; align-items:flex-end;">
                <div style="flex:2"><label class="stat-label">Food Item</label><input type="text" id="food-name" placeholder="E.g. Apple"></div>
                <div style="flex:1"><label class="stat-label">Kcal</label><input type="number" id="food-kcal" placeholder="0"></div>
            </div>
            <button class="btn btn-primary" onclick="addLog('food')">Add Food Entry</button>
            <div style="margin: 25px 0; border-top: 1px solid var(--glass-border)"></div>
            <label class="stat-label">Workout Type / Name</label>
<div style="display:flex; gap:10px;">
    <input type="text" id="work-name" placeholder="E.g. Walking" style="flex:2">
    <select id="work-met" style="flex:1" onchange="syncWorkoutName(this)">
        <option value="custom">Custom</option>
        <option value="3.5">Walking</option>
        <option value="7.0">Jogging</option>
        <option value="10.0">Running</option>
        <option value="5.5">Weightlifting</option>
    </select>
</div>

<div style="display:flex; gap:10px; align-items:flex-end;">
    <div style="flex:1">
        <label class="stat-label">Duration (Mins)</label>
        <input type="number" id="work-mins" placeholder="0" oninput="calcLiveWorkout()">
    </div>
    <div style="flex:1">
        <label class="stat-label">Burn (kcal)</label>
        <input type="number" id="work-kcal-input" placeholder="0">
    </div>
</div>

<div id="live-burn-preview" style="font-size: 0.75rem; color: var(--success); margin-top: 5px; font-weight: 700; height: 15px;"></div>

<button class="btn btn-success" onclick="addLog('workout')">Add Workout Entry</button>
</div>
        <h3 id="logs-title" style="font-weight: 800; font-size: 1.1rem;">Today's Logs</h3>
        <div id="history-list" class="card" style="padding: 5px;"></div>
    </div>

    <div id="page-profile" class="page">
        <h2 style="font-weight: 800;">Profile Settings</h2>
        <div class="card" style="background: rgba(56, 189, 248, 0.05);">
            <h3 style="margin-top:0">Weight Loss Goal</h3>
            <label class="stat-label">Kgs to Lose</label><input type="number" id="p-lose">
            <label class="stat-label">By Date</label><input type="date" id="p-date">
            <button class="btn btn-success" onclick="saveTarget()">Start New Journey</button>
        </div>
        <div class="card">
            <label class="stat-label">Current Weight (kg)</label><input type="number" id="p-weight">
            <label class="stat-label">Height (cm)</label><input type="number" id="p-height">
            <label class="stat-label">Age</label><input type="number" id="p-age">
            <label class="stat-label">Activity Level</label>
            <select id="p-life"><option value="1.2">Sedentary</option><option value="1.35">Moderate</option><option value="1.5">Active</option></select>
            <label class="stat-label">Daily Deficit Goal</label><input type="number" id="p-goal">
            <button class="btn btn-primary" onclick="saveProfile()">Update Profile</button>
        </div>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-item active" onclick="showPage('dash', this)">DASHBOARD</div>
    <div class="nav-item" onclick="showPage('add', this)">LOGS</div>
    <div class="nav-item" onclick="showPage('profile', this)">PROFILE</div>
</nav>

<script>
    let viewedDate = new Date();
    let profile = JSON.parse(localStorage.getItem('calx_v7_profile')) || { weight: 85, height: 175, age: 25, goal: 500, life: 1.2 };
    let journey = JSON.parse(localStorage.getItem('calx_v7_journey')) || { totalNeeded: 0, targetDate: null, startWeight: 85, startDate: new Date().toISOString() };
    let logs = JSON.parse(localStorage.getItem('calx_v7_logs')) || [];

    function showPage(pId, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('page-'+pId).classList.add('active');
        el.classList.add('active');
        if(pId === 'add') renderLogs();
    }

   function changeDate(days) {
    let tempDate = new Date(viewedDate);
    tempDate.setDate(tempDate.getDate() + days);
    
    // Block future dates
    // if (tempDate > new Date()) return;

    viewedDate = tempDate;
    const today = new Date().toLocaleDateString();
    const current = viewedDate.toLocaleDateString();
    
    document.getElementById('display-date').innerText = (today === current) ? "Today" : current;
    
    // Handle Forward Button state
    const forwardBtn = document.getElementById('btn-forward');
    if (today === current) {
        forwardBtn.style.opacity = "0.2";
        forwardBtn.style.pointerEvents = "none";
    } else {
        forwardBtn.style.opacity = "1";
        forwardBtn.style.pointerEvents = "auto";
    }

    renderLogs();
    updateEngine();
}

    function jumpToDate(val) {
    if(!val) return;
    let tempDate = new Date(val);
    
    // Block future dates
    if (tempDate > new Date()) {
        alert("Cannot select future dates");
        return;
    }
    
    viewedDate = tempDate;
    changeDate(0); // This triggers the button disable logic automatically
}

// Add this line at the very bottom of your <script> to grey out future dates in the calendar
document.getElementById('date-jump').max = new Date().toISOString().split("T")[0];

    function saveTarget() {
        journey = { totalNeeded: parseFloat(document.getElementById('p-lose').value) * 7700, targetDate: document.getElementById('p-date').value, startWeight: profile.weight, startDate: new Date().toISOString() };
        localStorage.setItem('calx_v7_journey', JSON.stringify(journey));
        updateEngine();
    }

    function saveProfile() {
        profile = { weight: parseFloat(document.getElementById('p-weight').value), height: parseFloat(document.getElementById('p-height').value), age: parseFloat(document.getElementById('p-age').value), goal: parseFloat(document.getElementById('p-goal').value), life: parseFloat(document.getElementById('p-life').value) };
        localStorage.setItem('calx_v7_profile', JSON.stringify(profile));
        updateEngine();
    }
    // Syncs the dropdown selection to the text box
function syncWorkoutName(sel) {
    const nameInput = document.getElementById('work-name');
    if (sel.value !== "custom") {
        nameInput.value = sel.options[sel.selectedIndex].text;
    }
    calcLiveWorkout();
}

// Calculates calories in real-time as you type
function calcLiveWorkout() {
    const met = document.getElementById('work-met').value;
    const mins = parseFloat(document.getElementById('work-mins').value) || 0;
    const kcalInput = document.getElementById('work-kcal-input');
    const preview = document.getElementById('live-burn-preview');

    if (met !== "custom") {
        // Standard MET formula: (MET * 3.5 * weight_kg) / 200 * mins
        const burn = Math.floor((parseFloat(met) * 3.5 * profile.weight) / 200 * mins);
        kcalInput.value = burn > 0 ? burn : "";
        preview.innerText = burn > 0 ? `Estimated Burn: ${burn} kcal` : "";
    } else {
        preview.innerText = "Manual entry mode";
    }
}

// Updated AddLog to handle the new fields
function addLog(type) {
    let kcal, name;
    
    if (type === 'food') {
        kcal = parseFloat(document.getElementById('food-kcal').value);
        name = document.getElementById('food-name').value || "Food";
    } else {
        // Use the value from the manual calorie input field
        kcal = parseFloat(document.getElementById('work-kcal-input').value);
        name = document.getElementById('work-name').value || "Workout";
    }

    if (!kcal || kcal <= 0) return;

    logs.push({ 
        type, 
        name, 
        kcal, 
        id: Date.now(), 
        date: viewedDate.toISOString() 
    });

    localStorage.setItem('calx_v7_logs', JSON.stringify(logs));
    
    // Clear inputs
    if(type === 'workout') {
        document.getElementById('work-mins').value = "";
        document.getElementById('work-kcal-input').value = "";
        document.getElementById('live-burn-preview').innerText = "";
    }
    
    renderLogs();
    updateEngine();
}

   

    function deleteLog(id) {
        logs = logs.filter(l => l.id !== id);
        localStorage.setItem('calx_v7_logs', JSON.stringify(logs));
        renderLogs();
        updateEngine();
    }

    function renderLogs() {
        const cont = document.getElementById('history-list');
        const currentStr = viewedDate.toLocaleDateString();
        document.getElementById('logs-title').innerText = currentStr === new Date().toLocaleDateString() ? "Today's Logs" : "Logs for " + currentStr;
        const filtered = logs.filter(l => new Date(l.date).toLocaleDateString() === currentStr);
        cont.innerHTML = filtered.length ? '' : '<div style="padding:20px; text-align:center; color:#64748b; font-size:0.8rem">No entries for this date</div>';
        filtered.slice().reverse().forEach(l => {
            cont.innerHTML += `<div class="log-item"><div><small style="color:var(--primary);text-transform:uppercase">${l.type}</small><br><b>${l.name}</b></div><div style="display:flex;align-items:center"><span style="font-weight:800;color:${l.type=='food'?'#94a3b8':'var(--success)'}">${l.type=='food'?'+':'-'}${l.kcal}</span><button class="del-btn" onclick="deleteLog(${l.id})">×</button></div></div>`;
        });
    }

  function updateEngine() {
    const now = new Date();
    const bmr = ((9 * profile.weight) + (5.25 * profile.height) - (5 * profile.age) + 5) * profile.life;
    const isToday = viewedDate.toLocaleDateString() === now.toLocaleDateString();
    
    // 1. DAILY STATS (This remains dynamic based on the date you are viewing)
    let restingBurn = isToday ? (bmr / 86400) * ((now - new Date().setHours(0,0,0,0)) / 1000) : bmr;
    const vStr = viewedDate.toLocaleDateString();
    const vLogs = logs.filter(l => new Date(l.date).toLocaleDateString() === vStr);
    const food = vLogs.filter(l => l.type === 'food').reduce((s, l) => s + l.kcal, 0);
    const work = vLogs.filter(l => l.type === 'workout').reduce((s, l) => s + l.kcal, 0);
    const dailyNet = (restingBurn + work) - food;
    const gap = dailyNet - profile.goal;

    // 2. STATIC JOURNEY STATS (Fixed to actual "now", ignoring history navigation)
    const startChallenge = new Date(journey.startDate);
    const targetDate = new Date(journey.targetDate);
    
    // Total deficit earned from start until the actual current second
    const realDeficitToNow = ((bmr / 86400) * (Math.abs(now - startChallenge) / 1000)) + 
        logs.filter(l => new Date(l.date) <= now)
            .reduce((s, l) => s + (l.type === 'workout' ? l.kcal : -l.kcal), 0);

    const journeyRemaining = journey.totalNeeded - realDeficitToNow;
    const actualDaysLeft = Math.ceil((targetDate - now) / 86400000);
    const dailyTargetNeeded = actualDaysLeft > 0 ? (journeyRemaining / actualDaysLeft) : 0;
    const currentExpectedWeight = journey.startWeight - (realDeficitToNow / 7700);

    // 3. UPDATE UI
    // Dynamic Top Section (Changes with history)
    document.getElementById('net-val').innerText = Math.floor(dailyNet);
    document.getElementById('rest-burn').innerText = Math.floor(restingBurn);
    document.getElementById('work-burn').innerText = work;
    document.getElementById('intake-total').innerText = food;
    document.getElementById('goal-gap').innerText = Math.floor(gap);
    
    // Static Middle Section (Always shows live journey status)
    document.getElementById('journey-val').innerText = Math.floor(journeyRemaining) + " kcal";
    document.getElementById('days-left').innerText = actualDaysLeft > 0 ? actualDaysLeft : "0";
    document.getElementById('daily-req').innerText = dailyTargetNeeded > 0 ? Math.floor(dailyTargetNeeded) + " /d" : "--";
    document.getElementById('expected-weight').innerText = currentExpectedWeight.toFixed(3) + " kg";
    
    document.getElementById('bmr-tag').innerText = `BMR: ${Math.floor(bmr)} kcal/day`;

    // Needle Logic
    let ang = 90 + (gap * 0.15); 
    ang = Math.max(0, Math.min(180, ang));
    document.getElementById('needle-group').style.transform = `rotate(${ang}deg)`;
    const sd = document.getElementById('status-desc');
    sd.innerText = gap > 0 ? "DEFICIT REACHED" : "INCREASE BURN";
    sd.style.color = gap > 0 ? "#38bdf8" : "#ef4444";
}
    document.getElementById('p-weight').value = profile.weight;
    document.getElementById('p-height').value = profile.height;
    document.getElementById('p-age').value = profile.age;
    document.getElementById('p-goal').value = profile.goal;
    document.getElementById('p-life').value = profile.life;
    setInterval(updateEngine, 1000);
    updateEngine();
</script>
</body>
</html>
